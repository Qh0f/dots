# ══════════════════════════════════════════════
#  Starship — Monochrome
# ══════════════════════════════════════════════

format = """
[](fg:#48454f)\
$directory\
[](fg:#48454f bg:#201f25)\
$git_branch$git_status\
[](fg:#201f25)
$character"""

right_format = """$cmd_duration"""

add_newline = true

palette = "mono"

[palettes.mono]
bg0     = "#141318"
bg1     = "#201f25"
bg2     = "#2b292f"
fg0     = "#e5e1e9"
fg1     = "#c9c5d0"
fg2     = "#928f99"
border  = "#48454f"

[directory]
style = "fg:fg0 bg:bg1"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
style = "fg:fg1 bg:bg1"
format = "[ $symbol$branch ]($style)"
symbol = " "

[git_status]
style = "fg:fg2 bg:bg1"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "*"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](bold fg0)"
error_symbol = "[❯](bold fg2)"
vimcmd_symbol = "[❮](bold fg1)"

[cmd_duration]
min_time = 2000
format = "[ took $duration ](fg:fg2)"

[username]
disabled = true

[hostname]
disabled = true

[nodejs]
symbol = " "
style = "fg:fg1"
format = "[$symbol($version) ]($style)"

[python]
symbol = " "
style = "fg:fg1"
format = "[$symbol($version) ]($style)"

[rust]
symbol = " "
style = "fg:fg1"
format = "[$symbol($version) ]($style)"

[golang]
symbol = " "
style = "fg:fg1"
format = "[$symbol($version) ]($style)"

[package]
disabled = true

[time]
disabled = true
